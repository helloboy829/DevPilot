name: Unit Tests

on:
  push:
    branches: ["main", "2.0.x-dev"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-local-qa-files:
    # Byte-counted reads/writes must also pass on the native Windows CRT.
    # Locked runtime wheels and synthetic files; no backend or real calls.
    if: github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install hash-locked native runtime wheels
        run: |
          python -I scripts/build_local_qa_distribution.py --dependency-lock > "$env:RUNNER_TEMP/local-qa-runtime.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r "$env:RUNNER_TEMP/local-qa-runtime.lock"
      - name: Verify native Windows local QA files and pure domains
        env:
          PYTHONPATH: devpilot/src
        run: |
          python -m unittest discover -s devpilot/src/devpilot/evaluation/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s devpilot/src/devpilot/toolkit/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s backend/tests -p test_local_qa_byte_io.py -v

  default-install-collection:
    # The main job installs --extra postgres; this job proves the documented
    # contributor path (uv sync --group dev, no extras) still collects the
    # whole suite, so optional-dependency imports must stay lazy.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies (documented default)
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Collect backend tests
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import threading
          import traceback

          # Preserve the CI console before pytest installs fd-level capture.
          console = os.fdopen(os.dup(sys.stdout.fileno()), "w", encoding="utf-8", buffering=1)

          def report_slow_collection():
              # Frames only: no arguments, locals, source lines or credentials.
              lines = []
              for thread_id, frame in list(sys._current_frames().items())[:8]:
                  lines.append(f"Thread {thread_id}")
                  for current, lineno in list(traceback.walk_stack(frame))[:24]:
                      code = current.f_code
                      lines.append(f"{code.co_filename}:{lineno} in {code.co_name}")
              message = "\n".join(lines)[:8192]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::warning title=Slow backend collection::" + message, file=console, flush=True)

          diagnostic = threading.Timer(60, report_slow_collection)
          diagnostic.daemon = True
          diagnostic.start()
          try:
              import pytest
              raise SystemExit(pytest.main(["--collect-only", "-q"]))
          finally:
              diagnostic.cancel()
              diagnostic.join()
              console.close()
          PY

  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The full offline suite now prints ~13.6k passes in ~11-14 minutes before
    # service startup/cleanup; 20 minutes keeps a slow runner from cancelling a
    # successful run. This is a capacity bound, not a test timeout.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      UV_FROZEN: "1"
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev --extra postgres

      - name: Run unit tests of backend
        working-directory: backend
        env:
          # Expose the job's Postgres service to the cross-pod dedupe integration
          # tests (issue #4120), which read DEDUPE_TEST_POSTGRES_URL. Without this
          # mapping those tests silently skip and the headline capability is never
          # exercised in CI.
          DEDUPE_TEST_POSTGRES_URL: ${{ env.TEST_POSTGRES_URI }}
          PYTEST_ADDOPTS: --junitxml=pytest-results.xml
        run: make test

      - name: Annotate failed backend test names
        if: failure()
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("pytest-results.xml")
          if not report.is_file():
              print("::warning::Backend pytest report unavailable; inspect the preceding setup/domain test step.")
              raise SystemExit(0)

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          failures = [
              case for case in ET.parse(report).iter("testcase")
              if case.find("failure") is not None or case.find("error") is not None
          ]
          print(f"Backend pytest failed/error cases: {len(failures)}")
          for case in failures[:20]:
              # Expose identities only, never captured stdout, exception text or locals.
              identity = f"{case.get('classname', '')}::{case.get('name', '')}"[:512]
              print("::error title=Backend pytest failure::" + escape(identity))
          if len(failures) > 20:
              print(f"::error::Additional backend failed/error cases: {len(failures) - 20}")
          PY

  local-qa-distribution:
    # Software-only distribution. All target/DNS/socket activity is synthetic.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build first-party wheel with hash-locked build tools
        run: |
          python -I -m venv "$RUNNER_TEMP/local-qa-build"
          "$RUNNER_TEMP/local-qa-build/bin/python" -I -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r devpilot/distribution/build-requirements.lock
          "$RUNNER_TEMP/local-qa-build/bin/python" -I -m pip --isolated check
          uv build devpilot --no-build-isolation --python "$RUNNER_TEMP/local-qa-build/bin/python" --out-dir "$RUNNER_TEMP/local-qa-wheels"
      - name: Prepare exact runtime wheels and build offline software archive
        run: |
          python -I scripts/build_local_qa_distribution.py --dependency-lock > "$RUNNER_TEMP/local-qa-runtime.lock"
          python -I -m pip --isolated download --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r "$RUNNER_TEMP/local-qa-runtime.lock" --dest "$RUNNER_TEMP/local-qa-dependencies"
          python -I scripts/build_local_qa_distribution.py --wheelhouse "$RUNNER_TEMP/local-qa-dependencies" --wheel "$RUNNER_TEMP/local-qa-wheels/devpilot-0.1.0-py3-none-any.whl" --output "$RUNNER_TEMP/local-qa-distribution.zip" --source-revision "$GITHUB_SHA"
      - name: Verify new offline venv and actual installed mock CLI / reconciliation
        run: |
          archive_hash=$(sha256sum "$RUNNER_TEMP/local-qa-distribution.zip" | cut -d' ' -f1)
          python scripts/check_local_qa_distribution.py --archive "$RUNNER_TEMP/local-qa-distribution.zip" --sha256 "$archive_hash" --work-directory "$RUNNER_TEMP/local-qa-verification"
      - name: Hash software-only artifact for the separate API verifier
        run: |
          cd "$RUNNER_TEMP"
          sha256sum local-qa-distribution.zip > local-qa-distribution.zip.sha256
      - name: Retain software-only archive for independent API verification
        uses: actions/upload-artifact@v4
        with:
          name: local-qa-software-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-qa-distribution.zip
            ${{ runner.temp }}/local-qa-distribution.zip.sha256
          if-no-files-found: error
          retention-days: 1

  authorized-export-installed:
    if: github.event.pull_request.draft == false
    needs: local-qa-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Retrieve independently verified software-only archive
        uses: actions/download-artifact@v4
        with:
          name: local-qa-software-${{ github.sha }}
          path: ${{ runner.temp }}/local-qa-software
      - name: Verify the declared artifact hash before API use
        working-directory: ${{ runner.temp }}/local-qa-software
        run: sha256sum --check local-qa-distribution.zip.sha256
      - name: Install backend verifier dependencies from frozen lock
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Verify synthetic API export with fresh installed offline software
        working-directory: backend
        env:
          UV_FROZEN: "1"
          PYTHONPATH: .
          TEST_QA_SOFTWARE_ARCHIVE: ${{ runner.temp }}/local-qa-software/local-qa-distribution.zip
        run: |
          export TEST_QA_SOFTWARE_SHA256=$(cut -d' ' -f1 "$TEST_QA_SOFTWARE_ARCHIVE.sha256")
          uv run pytest tests/test_authorized_qa_exports_installed.py -q --tb=short
